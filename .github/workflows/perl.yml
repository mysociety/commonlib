name: Perl Tests

on:
  push:
    branches: master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfile-slurp-perl libmailtools-perl \
          libmime-tools-perl libpath-class-perl

    - name: Run tests
      working-directory: ./perllib/mySociety/t
      run: prove -I../.. .
